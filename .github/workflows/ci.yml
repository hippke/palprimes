name: CI

on:
  push:
  pull_request:

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          use-mathlib-cache: true
      - name: Axiom whitelist
        working-directory: lean
        run: |
          lake env lean scripts/axioms.lean | tee axioms.txt
          test "$(grep -c 'depends on axioms: \[propext, Classical.choice, Quot.sound\]' axioms.txt)" = 2
      - name: Kernel replay (leanchecker, one module at a time)
        working-directory: lean
        run: |
          for f in $(find Palprimes -name '*.lean' | sort); do
            m=$(echo "${f%.lean}" | tr / .)
            echo "leanchecker $m"
            lake env leanchecker "$m"
          done
