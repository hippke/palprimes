name = "palprimes"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Palprimes"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

[[lean_lib]]
name = "Palprimes"

[[lean_lib]]
name = "Audit"
roots = ["Audit.Challenge", "Audit.Solution"]

[[lean_lib]]
name = "Omega3"
# no root module Omega3.lean: a module importing Omega3.Final would be at import depth 22, where lake overflows its stack
roots = ["Omega3.Final", "Omega3.Audit.Challenge", "Omega3.Audit.Solution"]
globs = ["Omega3.+"]

[[lean_lib]]
name = "KappaOmega2"
# no root module KappaOmega2.lean: FinalK is at import depth 21, a module importing it would be at depth 22 (lake stack overflow)
roots = ["KappaOmega2.FinalK", "KappaOmega2.Audit.Challenge", "KappaOmega2.Audit.Solution"]
globs = ["KappaOmega2.+"]
